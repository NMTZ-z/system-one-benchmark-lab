[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "local-system-one"
version = "0.2.0rc1"
description = "Local typed-decision control plane for Apple Silicon agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Local System One contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "laya-mlx==0.2.0",
]

[project.optional-dependencies]
ane = [
  "laya-coreml @ git+https://github.com/mizorewww/laya-coreml.git@4619e0483f07adf39068532e85b42ec2347edb83",
]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8"]

[project.scripts]
local-system-one = "local_system_one.cli:main"
local-system-one-mcp = "local_system_one.mcp_server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["local_system_one"]
exclude = ["/local_system_one/decision_opportunity.py"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/hermes/local-system-one-hermes/__init__.py" = "local_system_one/_hermes/integrations/hermes/local-system-one-hermes/__init__.py"
"integrations/hermes/local-system-one-hermes/plugin.yaml" = "local_system_one/_hermes/integrations/hermes/local-system-one-hermes/plugin.yaml"
"integrations/hermes/local-system-one-hermes/README.md" = "local_system_one/_hermes/integrations/hermes/local-system-one-hermes/README.md"
"scripts/hermes_system_one_common.sh" = "local_system_one/_hermes/scripts/hermes_system_one_common.sh"
"scripts/hermes_system_one_status.sh" = "local_system_one/_hermes/scripts/hermes_system_one_status.sh"
"scripts/hermes_system_one_ownership.py" = "local_system_one/_hermes/scripts/hermes_system_one_ownership.py"
"scripts/install_hermes_system_one_plugin.sh" = "local_system_one/_hermes/scripts/install_hermes_system_one_plugin.sh"
"scripts/set_hermes_system_one_mode.sh" = "local_system_one/_hermes/scripts/set_hermes_system_one_mode.sh"
"scripts/uninstall_hermes_system_one_plugin.sh" = "local_system_one/_hermes/scripts/uninstall_hermes_system_one_plugin.sh"

[tool.hatch.build.targets.sdist]
only-include = ["local_system_one", "pyproject.toml", "README.md", "LICENSE", "requirements/first-run-macos-arm64-py312.lock", "integrations/hermes/local-system-one-hermes/__init__.py", "integrations/hermes/local-system-one-hermes/plugin.yaml", "integrations/hermes/local-system-one-hermes/README.md", "scripts/hermes_system_one_common.sh", "scripts/hermes_system_one_status.sh", "scripts/hermes_system_one_ownership.py", "scripts/install_hermes_system_one_plugin.sh", "scripts/set_hermes_system_one_mode.sh", "scripts/uninstall_hermes_system_one_plugin.sh"]
exclude = ["/local_system_one/decision_opportunity.py"]
